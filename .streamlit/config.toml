# Tema do app. Cores neutras e próprias do projeto, sem imitar marcas.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ef"
textColor = "#0b0b0b"
font = "sans serif"
baseRadius = "0.5rem"
borderColor = "#e4e2dc"
showSidebarBorder = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
